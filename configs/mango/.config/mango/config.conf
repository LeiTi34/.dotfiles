# Mirrors configs/hyprland/.config/hypr/hyprland.lua; keep both in sync.

# Mango imports these into systemd/dbus itself, but leaves XDG_SESSION_TYPE
# at "tty" when started from a TTY.
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland

# Written by DMS's settings (theme, layout, cursor, displays). Options below
# override them; for monitor rules the first match wins, so DMS's display
# settings win over the host's monitors.conf.
source_optional=./dms/colors.conf
source_optional=./dms/layout.conf
source_optional=./dms/cursor.conf
source_optional=./dms/outputs.conf

# per host, from modules/hosts/<host>/mango.nix
source_optional=./monitors.conf

# Input
xkb_rules_layout=de
sloppy_focus=1
trackpad_natural_scrolling=1

# Appearance
gap_inner_horizontal=2
gap_inner_vertical=2
gap_outer_horizontal=5
gap_outer_vertical=5
border_px=2
border_radius=10
focus_color=0x33ccffee
border_color=0x595959aa
blur=0
shadows=0

# No gaps, border or rounding for a single window
smart_gaps=1
no_border_when_single=1
no_radius_when_single=1

# Master-stack layout on all tags (tile is the default layout)
tag_num=10

layer_rule=no_animation:1,layer_name:^(quickshell)$
layer_rule=no_animation:1,layer_name:^dms:.*

# Key bindings
bind=SUPER+SHIFT,c,killclient
bind=SUPER+SHIFT,q,quit
bind=SUPER,t,togglefloating
bind=SUPER,p,spawn,bemenu-run
bind=SUPER,Return,spawn,alacritty
bind=SUPER,b,togglefullscreen
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
bind=SUPER+SHIFT,h,zoom
bind=SUPER+SHIFT,k,exchange_stack_client,prev
bind=SUPER+SHIFT,j,exchange_stack_client,next

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,10,0
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9
bind=SUPER+SHIFT,0,tagsilent,10

axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

gesturebind=none,left,3,viewtoright_have_client
gesturebind=none,right,3,viewtoleft_have_client
gesturebind=none,up,3,togglefullscreen
gesturebind=none,down,3,togglefullscreen

bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,pamixer --default-source -t
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 10%-
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +10%

bind=SUPER+SHIFT,s,spawn_shell,g=$(slurp -d) && f=~/Pictures/screenshots/$(date +%Y-%m-%d_%H-%M-%S).png && grim -g "$g" "$f" && wl-copy < "$f"

# Autostart
exec_once=systemctl --user start hyprpolkitagent
exec_once=dms run
exec_once=nextcloud --background
exec_once=nm-applet
exec_once=netbird-ui
exec_once=rbw-agent
exec_once=RBW_PROFILE=work rbw-agent
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store
